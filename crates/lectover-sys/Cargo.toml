[package]
name = "lectover-sys"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
# One native ggml per binary (spec D2): cargo refuses a second crate that links "ggml".
links = "ggml"
description = "Raw bindings to ggml (llama.cpp fork), qwentts.cpp and qwen3-asr.cpp, built as one static ggml"

[features]
metal = []
cuda = []
hip = []
vulkan = []

[build-dependencies]
cmake = "0.1.58"
bindgen = "0.73"

[dev-dependencies]
# Only for examples/spike.rs (reads the golden chunk JSON).
serde_json = "1"

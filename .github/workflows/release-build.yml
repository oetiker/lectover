name: Release build

# Called by Create release PR on the release branch before the pull request
# exists (D28). The archives need the submodules, a cargo feature per GPU
# backend and the Vulkan build environment, which no repo-infra release piece
# provides, so release-build-local.yml builds them. The Linux packages are
# built per distribution release by ri-release-distro-packages, from the
# Containerfile, the Makefile and nfpm.yaml at the top. ri-release-homebrew
# bottles Formula/lectover.rb from the macOS archive. Read-only: nothing
# here writes the repository.
on:
  workflow_call:
    inputs:
      version:
        description: The version being released.
        type: string
        required: true
      ref:
        description: The release branch head to build.
        type: string
        required: true

permissions:
  contents: read

jobs:
  archives:
    uses: ./.github/workflows/release-build-local.yml
    with:
      version: ${{ inputs.version }}
      ref: ${{ inputs.ref }}

  # Every release the piece builds except debian-12 and ubuntu-22.04 (the
  # linux-packages exception in .github/repo-infra.json).
  packages:
    uses: oposs/repo-infra/.github/workflows/ri-release-distro-packages.yml@v2
    with:
      version: ${{ inputs.version }}
      ref: ${{ inputs.ref }}
      submodules: recursive
      distributions: debian-13 ubuntu-24.04 ubuntu-26.04 almalinux-9 almalinux-10 fedora alpine-3.23 alpine-3.24

  # The formula names only aarch64-apple-darwin; the piece takes the archive
  # from the release-asset-aarch64-apple-darwin artifact of `archives`.
  homebrew:
    needs: archives
    uses: oposs/repo-infra/.github/workflows/ri-release-homebrew.yml@v2
    with:
      version: ${{ inputs.version }}
      ref: ${{ inputs.ref }}
      bin: lectover
